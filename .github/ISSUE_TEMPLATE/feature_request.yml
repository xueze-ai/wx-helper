name: 功能建议
description: 提议新插件、界面改进或使用体验优化
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景和预期行为。涉及微信账号、群聊或大模型账单的信息请脱敏。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的工作方式哪里不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
      description: 你希望界面或插件如何工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 可选

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 图形界面
        - 插件
        - 大模型 / 统计
        - 原生桥接
        - 文档
        - 打包 / 自动更新
        - 其他

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复建议
          required: true
        - label: 我没有在内容中包含真实密钥、账号、群 ID 或聊天记录
          required: true
